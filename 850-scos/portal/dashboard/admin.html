<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · 850 SCOS</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--b2:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--g:#22c55e;--r:#ef4444;--a:#f59e0b;--ra:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh}
h1{font-size:18px;margin-bottom:4px}.sub{font-size:11px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--b2);border-radius:var(--ra);padding:16px;margin-bottom:12px;max-width:500px}
.card h3{font-size:12px;color:var(--muted);margin-bottom:12px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.fg input{width:100%;padding:8px 12px;background:var(--bg);color:var(--text);border:1px solid var(--b2);border-radius:6px;font-size:13px}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn-a{background:var(--accent);color:#fff}.btn-g{background:var(--g);color:#000}.btn-r{background:var(--r);color:#fff}
.msg{font-size:11px;padding:8px;border-radius:4px;margin:8px 0;display:none}
.msg.ok{display:block;background:rgba(34,197,94,.15);color:var(--g)}
.msg.err{display:block;background:rgba(239,68,68,.15);color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{text-align:left;padding:6px 10px;background:var(--b2);color:var(--muted);font-size:9px;text-transform:uppercase}
td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
.bar{display:flex;gap:8px}.success{color:var(--g)}.fail{color:var(--r)}.pending{color:var(--a)}
</style>
</head>
<body>
<h1>850 SCOS Admin</h1>
<div class="sub">Account Management</div>

<div class="card">
  <h3>Admin Login</h3>
  <div id="login-msg" class="msg"></div>
  <div class="fg"><label>Admin Password</label><input type="password" id="admin-pw" placeholder="Enter admin password"></div>
  <button class="btn btn-a" onclick="login()">Login</button>
</div>

<div class="card" id="users-card" style="display:none">
  <h3>Users</h3>
  <div id="users-msg" class="msg"></div>
  <table><thead><tr><th>Username</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="users-body"></tbody></table>
  <div style="margin-top:12px"><button class="btn btn-g" onclick="approveAll()">Approve All Pending</button></div>
</div>

<script>
var adminToken=''
async function login(){
  var pw=document.getElementById('admin-pw').value
  if(!pw){msg('login','Enter password',false);return}
  try{
    var r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    var d=await r.json()
    if(d.ok){adminToken=d.token;msg('login','Logged in',true);loadUsers()}
    else{msg('login',d.error,false)}
  }catch(e){msg('login','Network error',false)}
}
async function loadUsers(){
  try{
    var r=await fetch('/api/admin-users?token='+adminToken)
    var d=await r.json()
    document.getElementById('users-card').style.display=''
    document.getElementById('users-body').innerHTML=d.users.map(function(u){
      return'<tr><td>'+u.username+'</td><td class="'+(u.status==='active'?'success':u.status==='disabled'?'fail':'pending')+'">'+u.status+'</td><td>'+(u.created||'').substring(0,10)+'</td><td>'+
        (u.status==='pending'?'<button class="btn btn-g" onclick="approve(\''+u.username+'\')">Approve</button>':'')+
        (u.status==='active'?'<button class="btn btn-r" onclick="disable(\''+u.username+'\')">Disable</button>':'')+
        (u.status==='disabled'?'<button class="btn btn-g" onclick="enable(\''+u.username+'\')">Enable</button>':'')+
      '</td></tr>'
    }).join('')
  }catch(e){msg('users','Load failed',false)}
}
async function approve(u){await action('approve',u)}
async function disable(u){await action('disable',u)}
async function enable(u){await action('enable',u)}
async function approveAll(){await action('approve-all')}
async function action(act,user){
  try{
    var r=await fetch('/api/admin-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:adminToken,action:act,username:user||''})})
    var d=await r.json()
    if(d.ok){loadUsers()}else{msg('users',d.error,false)}
  }catch(e){msg('users','Action failed',false)}
}
function msg(id,t,ok){var m=document.getElementById(id+'-msg');m.textContent=t;m.className='msg '+(ok?'ok':'err')}
</script>
</body>
</html>
